name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verificar projeto
        run: |
          echo "Arquivos do projeto:"
          ls -la
          echo "Conteudo do pubspec.yaml:"
          cat pubspec.yaml

      - name: Criar projeto Flutter se necessario
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create . --project-name controle_financeiro --platforms=android
          fi

      - name: Instalar dependencias do aplicativo
        run: |
          flutter pub add shared_preferences
          flutter pub add intl

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar aplicativo
        run: flutter analyze lib

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
